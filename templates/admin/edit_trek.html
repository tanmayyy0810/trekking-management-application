{% extends "base.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>Edit Trek</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">
<label>Trek Name</label>
<input
type="text"
class="form-control"
name="name"
value="{{ trek.trek_name }}"
required>
</div>

<div class="mb-3">
<label>Location</label>
<input
type="text"
class="form-control"
name="location"
value="{{ trek.location }}"
required>
</div>

<div class="mb-3">
<label>Difficulty</label>

<select
class="form-select"
name="difficulty">

<option {% if trek.difficulty=="Easy" %}selected{% endif %}>Easy</option>

<option {% if trek.difficulty=="Moderate" %}selected{% endif %}>Moderate</option>

<option {% if trek.difficulty=="Hard" %}selected{% endif %}>Hard</option>

</select>

</div>

<div class="mb-3">

<label>Duration</label>

<input
type="number"
class="form-control"
name="duration"
value="{{ trek.duration }}"
required>

</div>

<div class="mb-3">

<label>Available Slots</label>

<input
type="number"
class="form-control"
name="slots"
value="{{ trek.available_slots }}"
required>

</div>

<div class="mb-3">

<label>Status</label>

<select
class="form-select"
name="status">

<option {% if trek.status=="Pending" %}selected{% endif %}>Pending</option>

<option {% if trek.status=="Open" %}selected{% endif %}>Open</option>

<option {% if trek.status=="Closed" %}selected{% endif %}>Closed</option>

<option {% if trek.status=="Completed" %}selected{% endif %}>Completed</option>

</select>

</div>

<div class="mb-3">

<label>Start Date</label>

<input
type="date"
class="form-control"
name="start_date"
value="{{ trek.start_date }}"
required>

</div>

<div class="mb-3">

<label>End Date</label>

<input
type="date"
class="form-control"
name="end_date"
value="{{ trek.end_date }}"
required>

</div>

<div class="mb-3">

<label>Description</label>

<textarea
class="form-control"
name="description"
rows="4">{{ trek.description }}</textarea>

</div>

<button
class="btn btn-warning">

Update Trek

</button>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
