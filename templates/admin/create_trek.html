{% extends "base.html" %}

{% block title %}Create Trek{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header bg-success text-white">
                <h3>Create New Trek</h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label>Trek Name</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label>Image URL</label>

                        <input
                            type="text"
                            name="image_url"
                            class="form-control"
                            placeholder="https://...."
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Location</label>
                        <input type="text" class="form-control" name="location" required>
                    </div>
                    <div class="mb-3">
                        <label>Price (₹)</label>

                        <input
                            type="number"
                            name="price"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Difficulty</label>

                        <select class="form-select" name="difficulty" required>
                            <option value="">Select Difficulty</option>
                            <option>Easy</option>
                            <option>Moderate</option>
                            <option>Hard</option>
                        </select>

                    </div>

                    <div class="mb-3">
                        <label>Duration (Days)</label>
                        <input type="number" class="form-control" name="duration" min="1" required>
                    </div>

                    <div class="mb-3">
                        <label>Available Slots</label>
                        <input type="number" class="form-control" name="slots" min="1" required>
                    </div>

                    <div class="mb-3">
                        <label>Start Date</label>
                        <input type="date" class="form-control" name="start_date" required>
                    </div>

                    <div class="mb-3">
                        <label>End Date</label>
                        <input type="date" class="form-control" name="end_date" required>
                    </div>
                    <div class="mb-3">
                        <label>Description</label>
                        <textarea class="form-control" name="description" rows="4"
                            placeholder="Enter trek description (optional)">
    </textarea>
                    </div>

                    <button class="btn btn-success">
                        Create Trek
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
