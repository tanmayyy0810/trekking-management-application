{% extends "base.html" %}

{% block title %}
Staff Login
{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3 class="text-center">

Trek Staff Login

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<button
class="btn btn-warning w-100">

Login

</button>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
