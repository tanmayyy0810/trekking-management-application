{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-custom text-white">

                <h3 class="text-center">
                    Login
                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label>Email</label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>

                    </div>

                    <button class="btn btn-custom w-100">

                        Login

                    </button>

                </form>

                <hr>

                <p class="text-center mb-0">

                    Don't have an account?

                </p>

                <div class="text-center">

                    <a href="{{ url_for('auth.trekker_register') }}">
                        Register as Trekker
                    </a>

                    |

                    <a href="{{ url_for('auth.staff_register') }}">
                        Register as Staff
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
