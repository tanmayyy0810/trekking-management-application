{% extends "base.html" %}

{% block title %}
Staff Registration
{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-7">

<div class="card shadow">

<div class="card-header bg-warning">

<h3 class="text-center">
Trek Staff Registration
</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">
<label>Full Name</label>
<input
type="text"
name="name"
class="form-control"
required>
</div>

<div class="mb-3">
<label>Email</label>
<input
type="email"
name="email"
class="form-control"
required>
</div>

<div class="mb-3">
<label>Phone Number</label>
<input
type="text"
name="phone"
class="form-control"
required>
</div>

<div class="mb-3">
<label>Password</label>
<input
type="password"
name="password"
class="form-control"
required>
</div>

<div class="mb-3">
<label>Confirm Password</label>
<input
type="password"
name="confirm_password"
class="form-control"
required>
</div>

<button class="btn btn-warning w-100">

Register

</button>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
