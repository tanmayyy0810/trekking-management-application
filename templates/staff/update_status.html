{% extends "base.html" %}

{% block title %}
Update Trek Status
{% endblock %}

{% block content %}

<div class="card shadow p-4">

<h2>{{ trek.trek_name }}</h2>

<form method="POST">

<div class="mb-3">

<label>Status</label>

<select
name="status"
class="form-select">

{% for status in ["Open","Closed","Started","Ongoing","Completed"] %}

<option
value="{{ status }}"
{% if trek.status==status %}selected{% endif %}>

{{ status }}

</option>

{% endfor %}

</select>

</div>

<button class="btn btn-custom">

Update Status

</button>

</form>

</div>

{% endblock %}
