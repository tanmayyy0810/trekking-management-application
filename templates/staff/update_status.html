{% extends "base.html" %}

{% block title %}
Update Trek Status
{% endblock %}

{% block content %}

<div class="card shadow p-4">

<h2>{{ trek.trek_name }}</h2>

<form method="POST">

<div class="mb-3">

<label>Status</label>

<div class="mb-3">

<label class="form-label">Trek Status</label>

<select
name="status"
class="form-select">

<option value="Pending"
{% if trek.status=="Pending" %}selected{% endif %}>
Pending
</option>

<option value="Open"
{% if trek.status=="Open" %}selected{% endif %}>
Open
</option>

<option value="Ongoing"
{% if trek.status=="Ongoing" %}selected{% endif %}>
Ongoing
</option>

<option value="Completed"
{% if trek.status=="Completed" %}selected{% endif %}>
Completed
</option>

<option value="Closed"
{% if trek.status=="Closed" %}selected{% endif %}>
Closed
</option>

</select>

</div>

<button class="btn btn-custom">
Update Status
</button>

</div>


</form>

</div>

{% endblock %}
