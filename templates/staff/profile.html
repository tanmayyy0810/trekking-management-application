{% extends "base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}

<div class="card shadow p-4">

<h2 class="mb-4">Update Profile</h2>

<form method="POST">

<div class="mb-3">
<label>Name</label>
<input
type="text"
name="name"
class="form-control"
value="{{ current_user.name }}">
</div>

<div class="mb-3">
<label>Email</label>
<input
type="email"
name="email"
class="form-control"
value="{{ current_user.email }}">
</div>

<div class="mb-3">
<label>Phone</label>
<input
type="text"
name="phone"
class="form-control"
value="{{ profile.phone }}">
</div>

<div class="mb-3">
<label>Experience</label>
<input
type="number"
name="experience"
class="form-control"
value="{{ profile.experience }}">
</div>

<button class="btn btn-custom">
Save Changes
</button>

</form>

</div>

{% endblock %}
